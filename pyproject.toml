[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "piton"
version = "0.4.1"
description = "Piton — Lockfile and static supply-chain scanner for MCP servers, Claude Code hooks, and Cursor rules"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Bright Onwe"}
]
keywords = ["piton", "mcp", "ai-agents", "claude-code", "cursor", "security", "envoy", "ext-proc", "supply-chain", "ci-cd"]
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/Tony-Stark2025/piton"
Repository = "https://github.com/Tony-Stark2025/piton"
Issues = "https://github.com/Tony-Stark2025/piton/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

[project.scripts]
piton = "piton.cli:main"

[tool.setuptools.packages.find]
include = ["piton*"]
