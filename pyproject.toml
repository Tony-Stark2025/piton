[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "piton"
version = "0.3.0"
description = "Piton — The package-lock.json & supply-chain firewall for AI coding agents (split-hash MCP pinning, Claude/Cursor hook RCE linting, shadow replay -> CEL/Cedar & Envoy v3 ext_proc sidecar)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Gaussian Labs"}
]
keywords = ["piton", "mcp", "ai-agents", "claude-code", "cursor", "security", "envoy", "ext-proc", "supply-chain", "ci-cd"]
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
pentest = [
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "structlog>=24.1.0",
    "rich>=13.7.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "google-genai>=0.1.1",
    "psutil>=5.9.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

[project.scripts]
piton = "piton.cli:main"
piton-scan = "piton.cli_scan:main"

[tool.setuptools.packages.find]
include = ["piton*"]
