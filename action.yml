name: "Piton — MCP Lockfile & AI Agent Supply-Chain Gate"
description: "Pin MCP manifests with split SHA-256 hashes, catch Claude Code / Cursor hook RCE & skill poisoning in PRs, and block third-party MCP rug pulls."
branding:
  icon: "lock"
  color: "orange"

inputs:
  repo:
    description: "Repository directory to scan for coding-agent hooks, skills, rules, and MCP configs"
    required: false
    default: "."
  config:
    description: "Path to piton.yaml (defaults to piton.yaml)"
    required: false
    default: "piton.yaml"
  lockfile:
    description: "Path to piton.lock (defaults to piton.lock)"
    required: false
    default: "piton.lock"
  manifest:
    description: "Path to observed MCP tools/list JSON manifest (optional when probe=true)"
    required: false
    default: ""
  probe:
    description: "Set to 'true' to live-probe HTTP/SSE and STDIO MCP servers declared in config"
    required: false
    default: "false"
  probe-timeout:
    description: "Per-server probe timeout in seconds when probe=true"
    required: false
    default: "8"
  scan-only:
    description: "Set to 'true' to run only static coding-agent hook/skill/rules RCE & poisoning scan without MCP lockfile diff"
    required: false
    default: "false"
  python-version:
    description: "Python version to use for running Piton CLI"
    required: false
    default: "3.11"

outputs:
  exit-code:
    description: "Exit code returned by Piton gate (0=pass, 1=blocked)"
    value: ${{ steps.piton_gate.outputs.exit_code }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Piton CLI (2-dep slim install)
      shell: bash
      run: |
        python -m pip install --upgrade pip >/dev/null
        pip install --quiet "${{ github.action_path }}"

    - name: Run Piton Supply-Chain & MCP Lockfile Gate
      id: piton_gate
      shell: bash
      run: |
        set +e
        SCAN_OUT="$(piton scan --repo "${{ inputs.repo }}" 2>&1)"
        SCAN_RC=$?
        echo "${SCAN_OUT}"

        LOCK_OUT=""
        LOCK_RC=0
        if [ "${{ inputs.scan-only }}" != "true" ]; then
          CFG="${{ inputs.config }}"
          LOCK="${{ inputs.lockfile }}"
          if [ -z "${CFG}" ]; then CFG="piton.yaml"; fi
          if [ -z "${LOCK}" ]; then LOCK="piton.lock"; fi

          CMD=(piton lock --config "${CFG}" --lockfile "${LOCK}" --repo "${{ inputs.repo }}" --diff)
          if [ "${{ inputs.probe }}" = "true" ]; then
            CMD+=(--probe --probe-timeout "${{ inputs.probe-timeout }}")
          elif [ -n "${{ inputs.manifest }}" ]; then
            CMD+=(--manifest "${{ inputs.manifest }}")
          else
            echo "::error::Piton Lockfile Gate requires input 'manifest', 'probe: true', or 'scan-only: true'."
            exit 2
          fi

          LOCK_OUT="$("${CMD[@]}" 2>&1)"
          LOCK_RC=$?
          echo "${LOCK_OUT}"
        fi

        FINAL_RC=0
        if [ "${SCAN_RC}" -ne 0 ] || [ "${LOCK_RC}" -ne 0 ]; then
          FINAL_RC=1
        fi
        echo "exit_code=${FINAL_RC}" >> "${GITHUB_OUTPUT}"

        {
          echo "## Piton — AI Agent Supply-Chain & MCP Lockfile Gate"
          if [ "${FINAL_RC}" -eq 0 ]; then
            echo "**Status:** PASSED"
          else
            echo "**Status:** BLOCKED (scan_rc=${SCAN_RC}, lock_rc=${LOCK_RC})"
          fi
          echo ""
          echo '```text'
          echo "${SCAN_OUT}"
          if [ -n "${LOCK_OUT}" ]; then
            echo ""
            echo "${LOCK_OUT}"
          fi
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"

        exit "${FINAL_RC}"
