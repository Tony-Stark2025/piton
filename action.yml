name: "Prometheus Enterprise Autonomous AppSec & Patch Gate"
description: "In-VPC Glass-Box API Exploit Verification, 3-Tier PoV/Triage Disposition, CEGIS Auto-Patching, and Coding-Agent Supply-Chain Firewall."
author: "Prometheus Enterprise"

branding:
  icon: "shield"
  color: "red"

inputs:
  mode:
    description: "Execution mode: 'pentest' (live API + Glass-Box PR gate) or 'immunology' (lockfile + AST reachability + GitSpawn/Plugin4Shell scan)"
    required: false
    default: "pentest"
  target-url:
    description: "Target preview/staging API base URL (used in 'pentest' mode)"
    required: false
    default: "http://127.0.0.1:8000"
  spec-url:
    description: "OpenAPI schema URL or relative path"
    required: false
    default: "/openapi.json"
  target-dir:
    description: "Repository directory for Glass-Box AST reachability, Route-to-CVE mapping, and SWE patch synthesis"
    required: false
    default: "."
  app-cmd:
    description: "Optional command to boot the target application before scanning"
    required: false
    default: ""
  fail-on-exploit:
    description: "Exit with code 1 if any Tier A Verified PoV is confirmed"
    required: false
    default: "true"
  output-sarif:
    description: "Output file path for SARIF v2.1.0 report"
    required: false
    default: "prometheus-results.sarif"
  output-markdown:
    description: "Output file path for Staff-Engineer Markdown PR report"
    required: false
    default: "prometheus-report.md"
  output-diff:
    description: "Output file path for compiler-verified unified git diff"
    required: false
    default: "prometheus-fix.patch"

outputs:
  sarif-file:
    description: "Path to generated SARIF report"
    value: ${{ inputs.output-sarif }}
  markdown-file:
    description: "Path to generated Markdown PR report"
    value: ${{ inputs.output-markdown }}
  diff-file:
    description: "Path to generated unified git diff patch"
    value: ${{ inputs.output-diff }}

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: "${{ github.action_path }}/requirements-cli.txt"

    - name: Install Prometheus Runner Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r "${{ github.action_path }}/requirements-cli.txt"

    - name: Execute Prometheus Security Gate
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
      run: |
        if [ "${{ inputs.mode }}" = "immunology" ]; then
          python -m prometheus.cli_scan --immunology --target-dir "${{ inputs.target-dir }}" | tee prometheus-immunology.json
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "## 🛡️ Prometheus Continuous Immunology & Agentic Supply-Chain Report" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            head -n 80 prometheus-immunology.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
        else
          ARGS=(
            "--target-url" "${{ inputs.target-url }}"
            "--spec-url" "${{ inputs.spec-url }}"
            "--target-dir" "${{ inputs.target-dir }}"
            "--output-sarif" "${{ inputs.output-sarif }}"
            "--output-markdown" "${{ inputs.output-markdown }}"
            "--output-diff" "${{ inputs.output-diff }}"
          )
          if [ -n "${{ inputs.app-cmd }}" ]; then
            ARGS+=("--app-cmd" "${{ inputs.app-cmd }}")
          fi
          if [ "${{ inputs.fail-on-exploit }}" = "true" ]; then
            ARGS+=("--fail-on-exploit")
          fi
          python -m prometheus.cli_scan "${ARGS[@]}"
          if [ -f "${{ inputs.output-markdown }}" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "${{ inputs.output-markdown }}" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
