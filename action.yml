name: "Prometheus MCP Lockfile & Poisoning Gate"
description: "Diff-governed MCP manifest pinning (`prometheus.lock`), Day-1 prompt-injection linting, and cross-server tool shadowing PR gate."
branding:
  icon: "shield"
  color: "orange"

inputs:
  config:
    description: "Path to prometheus.yaml"
    required: false
    default: "prometheus.yaml"
  lockfile:
    description: "Path to prometheus.lock"
    required: false
    default: "prometheus.lock"
  manifest:
    description: "Path to observed MCP tools/list JSON manifest (optional when probe=true)"
    required: false
    default: ""
  probe:
    description: "Set to 'true' to probe live HTTP/SSE and STDIO MCP servers declared in prometheus.yaml"
    required: false
    default: "false"
  probe-timeout:
    description: "Per-server probe timeout in seconds when probe=true"
    required: false
    default: "8"
  python-version:
    description: "Python version to use for running Prometheus CLI"
    required: false
    default: "3.11"

outputs:
  exit-code:
    description: "Exit code returned by `prometheus lock --diff` (0=pass, 1=blocked)"
    value: ${{ steps.lock_gate.outputs.exit_code }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Prometheus CLI
      shell: bash
      run: |
        python -m pip install --upgrade pip >/dev/null
        pip install --quiet "${{ github.action_path }}"

    - name: Run Prometheus MCP Lockfile Diff & Poisoning Gate
      id: lock_gate
      shell: bash
      run: |
        set +e
        CMD=(prometheus lock --config "${{ inputs.config }}" --lockfile "${{ inputs.lockfile }}" --diff)
        if [ "${{ inputs.probe }}" = "true" ]; then
          CMD+=(--probe --probe-timeout "${{ inputs.probe-timeout }}")
        elif [ -n "${{ inputs.manifest }}" ]; then
          CMD+=(--manifest "${{ inputs.manifest }}")
        else
          echo "::error::Prometheus Lockfile Gate requires either input 'manifest' or 'probe: true'."
          exit 2
        fi

        OUTPUT="$("${CMD[@]}" 2>&1)"
        RC=$?
        echo "exit_code=${RC}" >> "${GITHUB_OUTPUT}"
        echo "${OUTPUT}"

        {
          echo "## Prometheus MCP Lockfile Gate"
          if [ "${RC}" -eq 0 ]; then
            echo "**Status:** PASSED"
          else
            echo "**Status:** BLOCKED (exit ${RC})"
          fi
          echo ""
          echo '```text'
          echo "${OUTPUT}"
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"

        exit "${RC}"
