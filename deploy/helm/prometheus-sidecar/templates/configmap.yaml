{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus-sidecar.fullname" . }}
  labels:
    {{- include "prometheus-sidecar.labels" . | nindent 4 }}
data:
  runtime_policy.json: |
{{ .Values.config.inline.runtimePolicyJson | indent 4 }}
  prometheus.lock: |
{{ .Values.config.inline.prometheusLockJson | indent 4 }}
{{- end }}
