apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prometheus-sidecar.fullname" . }}
  labels:
    {{- include "prometheus-sidecar.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "prometheus-sidecar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prometheus-sidecar.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus-sidecar
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--policy=/etc/prometheus/runtime_policy.json"
            - "--lock=/etc/prometheus/prometheus.lock"
            - "--traces=/var/log/prometheus/traces.jsonl"
            - "--addr=0.0.0.0:{{ .Values.service.httpPort }}"
            - "--grpc-addr=0.0.0.0:{{ .Values.service.grpcPort }}"
            {{- if .Values.redis.enabled }}
            - "--redis-addr={{ .Values.redis.addr }}"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: grpc-ext-proc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
          {{- if .Values.secrets.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          {{- else if or .Values.secrets.ledgerSigningKey .Values.secrets.tokenizerKey }}
          env:
            {{- if .Values.secrets.ledgerSigningKey }}
            - name: PROMETHEUS_LEDGER_SIGNING_KEY
              value: {{ .Values.secrets.ledgerSigningKey | quote }}
            {{- end }}
            {{- if .Values.secrets.tokenizerKey }}
            - name: PROMETHEUS_TOKENIZER_KEY
              value: {{ .Values.secrets.tokenizerKey | quote }}
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            grpc:
              port: {{ .Values.service.grpcPort }}
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: {{ .Values.service.grpcPort }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: policy-config
              mountPath: /etc/prometheus
              readOnly: true
            - name: ledger-logs
              mountPath: /var/log/prometheus
      volumes:
        - name: policy-config
          configMap:
            name: {{ default (include "prometheus-sidecar.fullname" .) .Values.config.existingConfigMap }}
        - name: ledger-logs
          emptyDir:
            sizeLimit: 512Mi
