{{- if .Values.envoyGateway.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: {{ include "piton-sidecar.fullname" . }}-ext-proc
  labels:
    {{- include "piton-sidecar.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: {{ .Values.envoyGateway.targetRef.group }}
      kind: {{ .Values.envoyGateway.targetRef.kind }}
      name: {{ .Values.envoyGateway.targetRef.name }}
  extProc:
    - failOpen: {{ .Values.envoyGateway.failOpen }}
      messageTimeout: {{ .Values.envoyGateway.messageTimeout }}
      processingMode:
        request:
          body: Buffered
        response:
          body: Buffered
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "piton-sidecar.fullname" . }}
          port: {{ .Values.service.grpcPort }}
{{- end }}
