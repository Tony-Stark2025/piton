{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "piton-sidecar.fullname" . }}
  labels:
    {{- include "piton-sidecar.labels" . | nindent 4 }}
data:
  runtime_policy.json: |
{{ .Values.config.inline.runtimePolicyJson | indent 4 }}
  piton.lock: |
{{ .Values.config.inline.pitonLockJson | indent 4 }}
{{- end }}
