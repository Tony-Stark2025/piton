apiVersion: v1
kind: Service
metadata:
  name: {{ include "piton-sidecar.fullname" . }}
  labels:
    {{- include "piton-sidecar.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "piton-sidecar.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: grpc-ext-proc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc-ext-proc
      protocol: TCP
      appProtocol: kubernetes.io/h2c
