name: Prometheus MCP Manifest Lock Gate

on:
  pull_request:
    paths:
      - "prometheus.yaml"
      - "prometheus.lock"
      - ".cursor/mcp.json"
      - ".mcp.json"
      - "mcp.json"
      - "**/observed_mcp_manifest*.json"

jobs:
  mcp-lock-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Prometheus CLI
        run: pip install --no-deps -e . && pip install pyyaml pydantic
      - name: Verify MCP Manifest Lockfile (Split Structural / Description Pin + Poisoning Lint)
        run: |
          if [ -f observed_mcp_manifest.json ]; then
            prometheus lock --config prometheus.yaml --lockfile prometheus.lock --manifest observed_mcp_manifest.json --diff
          elif [ -f prometheus.yaml ] && [ -f prometheus.lock ]; then
            prometheus lock --config prometheus.yaml --lockfile prometheus.lock --probe --diff
          else
            echo "::error::prometheus.yaml or prometheus.lock missing; run 'prometheus init --probe' and commit the lockfile."
            exit 1
          fi
