name: Piton CI Pipeline

on:
  push:
    branches: [ main, feat/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  go-sidecar-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: sidecar/go.sum

      - name: Run Go Sidecar Race Tests & Static Build
        working-directory: sidecar
        run: |
          go test -race -v ./...
          CGO_ENABLED=0 go build -trimpath -o bin/piton-sidecar ./cmd/piton-sidecar

  python-control-loop-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go (for cross-language sidecar integration test)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: sidecar/go.sum

      - name: Install Slim 2-Dep Package + Dev Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Full Piton CLI, Supply-Chain, Control Plane & Cross-Language Suites
        run: |
          timeout 300 pytest tests/ -v --tb=short

      - name: Verify 60-Second End-to-End Quickstart Demo
        run: |
          bash examples/quickstart-billing-agent/run_demo.sh

  dogfood-piton-action:
    name: Dogfood Piton GitHub Action (scan-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Piton Action on Self Repo
        uses: ./
        with:
          scan-only: "true"

  envoy-wire-e2e:
    name: Real Envoy v1.33 Proxy <-> Go Sidecar ext_proc Wire E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Boot Real Envoy v1.33 + Distroless Sidecar + MCP Upstream
        working-directory: deploy/envoy-e2e
        run: |
          docker compose up -d --build

      - name: Run Live Envoy ext_proc Wire Verification
        working-directory: deploy/envoy-e2e
        run: |
          python3 verify_envoy_e2e.py

      - name: Dump Logs on Failure & Tear Down
        if: always()
        working-directory: deploy/envoy-e2e
        run: |
          docker compose logs || true
          docker compose down -v

  helm-chart-lint:
    name: Validate Helm Chart & EnvoyExtensionPolicy CRD
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm & Lint/Template Chart
        run: |
          helm lint deploy/helm/piton-sidecar
          helm template piton-test deploy/helm/piton-sidecar \
            --set redis.enabled=true \
            --set controlPlane.collectorUrl=http://piton-control-plane:8090 \
            --set serviceMonitor.enabled=true \
            --set envoyGateway.enabled=true > /tmp/rendered.yaml
          grep -q "kind: EnvoyExtensionPolicy" /tmp/rendered.yaml
          grep -q "kind: ServiceMonitor" /tmp/rendered.yaml
          grep -q -- "--redis-addr=" /tmp/rendered.yaml
          grep -q -- "--collector-url=" /tmp/rendered.yaml
