name: Prometheus CI Pipeline

on:
  push:
    branches: [ main, feat/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  go-sidecar-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: sidecar/go.sum

      - name: Run Go Sidecar Race Tests & Static Build
        working-directory: sidecar
        run: |
          go test -race -v ./...
          CGO_ENABLED=0 go build -trimpath -o bin/prometheus-sidecar ./cmd/prometheus-sidecar

  python-control-loop-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Set up Go (for cross-language sidecar integration test)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: sidecar/go.sum

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Run Agent Control Loop, Cross-Language Sidecar & Unit Suites
        env:
          ENVIRONMENT: testing
          LOG_LEVEL: DEBUG
          USE_VERTEX_AI: "false"
          GEMINI_API_KEY: ""
        run: |
          timeout 300 pytest tests/test_sprint_abc_hardening_and_probe.py tests/test_agent_control_loop_v3.py tests/test_sidecar_integration.py tests/test_ifc_and_patch_risk_gate.py tests/test_security_hardening_fixes.py -v --tb=short
          timeout 300 pytest tests/unit/ -v --tb=short --durations=10
          timeout 300 pytest tests/integration/ -v --tb=short --durations=10
          timeout 300 pytest tests/test_prometheus_v25_architecture.py tests/test_commercial_saas_and_agentic_owasp.py tests/adversarial/ tests/test_endpoints.py -v --tb=short --durations=10

      - name: Verify 60-Second End-to-End Quickstart Demo
        run: |
          bash examples/quickstart-billing-agent/run_demo.sh

  envoy-wire-e2e:
    name: Real Envoy v1.33 Proxy <-> Go Sidecar ext_proc Wire E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Boot Real Envoy v1.33 + Distroless Sidecar + MCP Upstream
        working-directory: deploy/envoy-e2e
        run: |
          docker compose up -d --build

      - name: Run Live Envoy ext_proc Wire Verification
        working-directory: deploy/envoy-e2e
        run: |
          python3 verify_envoy_e2e.py

      - name: Dump Logs on Failure & Tear Down
        if: always()
        working-directory: deploy/envoy-e2e
        run: |
          docker compose logs || true
          docker compose down -v

  helm-chart-lint:
    name: Validate Helm Chart & EnvoyExtensionPolicy CRD
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm & Lint/Template Chart
        run: |
          helm lint deploy/helm/prometheus-sidecar
          helm template prometheus-test deploy/helm/prometheus-sidecar \
            --set redis.enabled=true \
            --set serviceMonitor.enabled=true \
            --set envoyGateway.enabled=true > /tmp/rendered.yaml
          grep -q "kind: EnvoyExtensionPolicy" /tmp/rendered.yaml
          grep -q "kind: ServiceMonitor" /tmp/rendered.yaml
          grep -q -- "--redis-addr=" /tmp/rendered.yaml

