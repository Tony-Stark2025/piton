name: Release Piton Sidecar & CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-sidecar-binaries:
    name: Build Static Go Sidecar Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: sidecar/go.sum

      - name: Run Go Race Tests
        working-directory: sidecar
        run: go test -race ./...

      - name: Cross-Compile Static Binaries (linux/darwin amd64/arm64)
        working-directory: sidecar
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            OUT="../dist/piton-sidecar-${GOOS}-${GOARCH}"
            echo "Building ${OUT}..."
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="-s -w" -o "${OUT}" ./cmd/piton-sidecar
          done
          (cd ../dist && sha256sum piton-sidecar-* > checksums.txt)

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-binaries
          path: dist/

  build-python-wheel:
    name: Build Python CLI Wheel & Sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Wheel & Sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist-py

      - name: Upload Python Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist-py/

  publish-ghcr-image:
    name: Build & Push Distroless Sidecar Image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU & Buildx
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize GHCR Owner to Lowercase
        id: repo
        run: |
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/piton-sidecar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Multi-Arch Distroless Image
        uses: docker/build-push-action@v6
        with:
          context: sidecar
          file: sidecar/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-sidecar-binaries, build-python-wheel, publish-ghcr-image]
    runs-on: ubuntu-latest
    steps:
      - name: Download Sidecar Binaries
        uses: actions/download-artifact@v4
        with:
          name: sidecar-binaries
          path: release-assets/

      - name: Download Python Dist
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
